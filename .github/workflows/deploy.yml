name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar Backend
        run: |
          cd backend
          npm install

      - name: Validar Frontend (Build)
        run: |
          cd frontend
          npm install
          npm run build

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-test
    # Solo desplegar en push a la rama principal (no en pull requests)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Desplegar en Azure VM vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_SOR_HOST }}
          username: ${{ secrets.VM_SOR_USER }}
          key: ${{ secrets.PRIVATE_KEY_SOR }}
          port: ${{ secrets.VM_SOR_PORT }}
          script_stop: true
          script: |
            # 1. Definir directorio del proyecto
            PROJECT_DIR="/home/azureuser/server/cpanel-server"

            # Si el directorio no existe, clonar el repositorio
            if [ ! -d "$PROJECT_DIR" ]; then
              mkdir -p /home/azureuser/server
              git clone "https://github.com/${{ github.repository }}.git" "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            # 2. Asegurar que la red externa de docker server-net existe
            docker network inspect server-net >/dev/null 2>&1 || docker network create server-net

            # 3. Descargar cambios más recientes
            git fetch origin master
            git reset --hard origin/master

            # 4. Reconstruir y levantar servicios con Docker Compose
            docker compose down
            docker compose up -d --build --remove-orphans

            # 5. Limpieza de imágenes huérfanas
            docker image prune -f
