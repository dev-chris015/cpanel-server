name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar Backend
        run: |
          cd backend
          npm install

      - name: Validar Frontend (Build)
        run: |
          cd frontend
          npm install
          npm run build

  deploy:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Desplegar en Azure VM vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_SOR_HOST }}
          username: ${{ secrets.VM_SOR_USER }}
          key: ${{ secrets.PRIVATE_KEY_SOR }}
          port: ${{ secrets.VM_SOR_PORT }}
          script_stop: true
          script: |
            # 1. Rutas clave
            SERVER_DIR="/home/azureuser/server"
            PROJECT_DIR="$SERVER_DIR/cpanel-server"

            # 2. Descargar últimos cambios en cpanel-server
            cd "$PROJECT_DIR"
            git fetch origin master
            git reset --hard origin/master

            # 3. Orquestar desde la raíz del servidor
            cd "$SERVER_DIR"

            # Recompilar y reiniciar solo los contenedores de cPanel sin tocar MariaDB, Checkmk ni WordPress
            docker compose up -d --build --no-deps cpanel-backend cpanel-frontend

            # 4. Limpieza de capas viejas
            docker image prune -f