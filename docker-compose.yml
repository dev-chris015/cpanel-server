version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpanel-backend
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=5000
      - DOCKER_SOCKET_PATH=/var/run/docker.sock
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpanel-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
